name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "**/README.md"
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "**/README.md"

jobs:
  macos-build:
    name: macOS Build (${{ matrix.linkage }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - linkage: Static Linking
            preset: ci-default
          - linkage: Dynamic Linking
            preset: ci-dylib

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Libraries
        run: |
          brew install icu4c cairo pango sdl3

      - name: Build And Test (${{ matrix.linkage }})
        run: |
          cmake --workflow --preset ${{ matrix.preset }}

  windows-deps:
    name: Windows Dependencies
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg\archives

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Warms the binary cache so the build jobs never compile ports themselves.
      - name: Cache vcpkg
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install Libraries
        run: ./scripts/Install-VcpkgDeps.ps1

  windows-build:
    name: Windows Build (${{ matrix.linkage }})
    runs-on: windows-latest
    needs: windows-deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - linkage: Static Linking
            preset: ci-default
          - linkage: Dynamic Linking
            preset: ci-dylib
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg\archives

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Restores the cache warmed by windows-deps, so installing is a no-op
      # extraction of prebuilt ports instead of a rebuild in each job.
      - name: Cache vcpkg
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install Libraries
        run: ./scripts/Install-VcpkgDeps.ps1

      - name: Build And Test (${{ matrix.linkage }})
        run: |
          . scripts/Use-VC.ps1
          Use-VC
          cmake --workflow --preset ${{ matrix.preset }}

  linux-build:
    name: Linux Build (${{ matrix.linkage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - linkage: Static Linking
            preset: ci-default
          - linkage: Dynamic Linking
            preset: ci-dylib

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Libraries
        run: |
          sudo apt update
          sudo apt install -y libicu-dev libpng-dev libcairo2-dev libpango1.0-dev \
            libxcb1-dev libxcb-cursor-dev libxkbcommon-dev libxcb-imdkit-dev libxkbcommon-x11-dev \
            libsdl3-dev

      - name: Build And Test (${{ matrix.linkage }})
        run: |
          cmake --workflow --preset ${{ matrix.preset }}
